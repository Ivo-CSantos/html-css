<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flexible Box</title>
    <style>
      div.container {
        background-color: lightsalmon;
        display: flex;
        flex-flow: row nowrap;
      }
      div.item {
        background-color: lightblue;
        border: 1px solid black;
        text-align: center;
        flex-basis: 150px;
      }
      div#id1 {
        flex: 1 0;
      }
      div#id2 {
        flex: 2 0;
      }
      div#id3 {
        flex: 1 2;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="item" id="id1">A</div>
      <div class="item" id="id2">B</div>
      <div class="item" id="id3">C</div>
    </div>
  </body>
</html>
