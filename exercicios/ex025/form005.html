<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formulários</title>
  </head>
  <body>
    <h1>Exemplo de formulários</h1>
    <form action="cadastro.php" method="get">
      <fieldset>
        <legend>Sexo</legend>
        <input type="radio" name="sexo" id="imasc" value="M" checked />
        <label for="imasc">Masculino</label><br />

        <input type="radio" name="sexo" id="ifem" value="F" />
        <label for="ifem">Feminino</label>
      </fieldset>

      <fieldset>
        <legend>Esportes favoritos</legend>

        <input type="checkbox" name="esporte-futebol" id="iesfut" checked />
        <label for="iesfut">Futebol</label>
        <br />

        <input type="checkbox" name="esporte-basquete" id="iesbasket" />
        <label for="iesbasket">Basquete</label> <br />

        <input type="checkbox" name="esporte-natacao" id="iesnat" />
        <label for="iesnat">Natação</label>
        <br />

        <input type="checkbox" name="esporte-tenis" id="iestenis" />
        <label for="iestenis">Tênis</label>
        <br />
      </fieldset>

      <p>
        <input type="submit" value="Enviar" />
        <input type="reset" value="Limpar" />
      </p>
    </form>
  </body>
</html>
